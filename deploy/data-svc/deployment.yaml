apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-svc
  namespace: data-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-svc
  template:
    metadata:
      labels:
        app: data-svc
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/bakerlunch-ai/data-svc:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: kalshi-credentials
          env:
            - name: DATA_SVC_NATS_URL
              value: nats://nats.nats.svc.cluster.local:4222
            - name: DATA_SVC_KALSHI_BASE_URL
              value: https://api.elections.kalshi.com/trade-api/v2
            - name: DATA_SVC_TICK_POLL_INTERVAL_SECONDS
              value: "5"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            # Await-first discovery scan can take ~100s on a cold start
            # (paginating the full Kalshi universe). startupProbe suspends
            # liveness until the app is serving, giving it a 5-min grace
            # window (periodSeconds 10 x failureThreshold 30) instead of
            # liveness's ~90s budget killing it mid-startup.
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
