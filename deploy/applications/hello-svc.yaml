apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-svc
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bakerlunch-ai/midas.git
    path: deploy/hello-svc
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
