[project]
name = "midas"
version = "0.1.0"
description = "Midas — multi-service prediction market trading bot"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
bot-events = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
