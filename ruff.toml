line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101"]

[lint.isort]
known-first-party = ["bot_events"]

[format]
quote-style = "double"
indent-style = "space"
