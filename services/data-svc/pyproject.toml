[project]
name = "data-svc"
version = "0.0.1"
description = "Midas data ingestion service — emits MarketTickEvent from Kalshi"
requires-python = ">=3.12"
dependencies = [
  "bot-events",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "cryptography>=43",
  "nats-py>=2.9",
  "asyncpg>=0.30",
  "redis>=5.2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
bot-events = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/data_svc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
