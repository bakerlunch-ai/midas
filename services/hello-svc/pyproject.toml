[project]
name = "hello-svc"
version = "0.1.0"
description = "Phase 1 proof-of-life service exercising the full Midas stack"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "nats-py>=2.7",
    "asyncpg>=0.30",
    "bot-events",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_svc"]

[tool.uv.sources]
bot-events = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
