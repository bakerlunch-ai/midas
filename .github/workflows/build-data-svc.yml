name: Build data-svc

on:
  push:
    branches: [main]
    paths:
      - "services/data-svc/**"
      - "packages/bot-events/**"
      - ".dockerignore"
      - ".github/workflows/build-data-svc.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/data-svc/Dockerfile
          push: true
          tags: |
            ghcr.io/bakerlunch-ai/data-svc:main
            ghcr.io/bakerlunch-ai/data-svc:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
